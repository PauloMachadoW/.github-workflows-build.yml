name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Achar a pasta do projeto
        id: p
        run: |
          D=$(dirname "$(find . -name capacitor.config.json -not -path '*/node_modules/*' | head -1)")
          echo "dir=$D" >> "$GITHUB_OUTPUT"
          echo "Projeto em: $D"
          ls -la "$D"
      - name: Instalar dependencias
        working-directory: ${{ steps.p.outputs.dir }}
        run: npm install --no-audit --no-fund
      - name: Criar projeto Android
        working-directory: ${{ steps.p.outputs.dir }}
        run: |
          npx cap add android
          npx cap sync android
      - name: Compilar APK
        working-directory: ${{ steps.p.outputs.dir }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: tartaruga-apk
          path: ${{ steps.p.outputs.dir }}/android/app/build/outputs/apk/debug/app-debug.apk
